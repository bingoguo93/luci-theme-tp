name: build-packages

on:
  workflow_dispatch:
  workflow_call:

# one build per ref at a time and drop superseded pending builds; builds
# started by the release workflow are never cancelled mid-flight
# (github.workflow is the caller's name when this file is reused)
concurrency:
  group: build-packages-${{ github.ref }}
  cancel-in-progress: ${{ github.workflow == 'build-packages' }}

jobs:
  build:
    name: ${{ matrix.branch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64
        branch:
          - openwrt-24.10
          - SNAPSHOT

    steps:
      - name: checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          path: ${{ github.event.repository.name }}

      - name: build
        # pinned to a fixed commit instead of @main for supply-chain safety
        uses: openwrt/gh-action-sdk@f5813d30eeef3534b58ac7e79c5d8842b6035434
        env:
          ARCH: ${{ matrix.arch }}-${{ matrix.branch }}
          PACKAGES: ${{ github.event.repository.name }}
          NO_REFRESH_CHECK: true

      - name: upload
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.branch }}-packages
          path: |
            bin/packages/${{ matrix.arch }}/action/*.ipk
            bin/packages/${{ matrix.arch }}/action/*.apk