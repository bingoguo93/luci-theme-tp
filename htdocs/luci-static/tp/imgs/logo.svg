<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 120" width="220" height="40" role="img" aria-label="T-Link">
  <!-- fictional wordmark; changing the brand name only needs a text edit below.
       for pixel-identical rendering on every device, convert the text to paths
       (e.g. Inkscape: select-all; object-to-path; export) -->
  <text x="4" y="94"
        font-family="'Arial Black','Segoe UI',Arial,Helvetica,sans-serif"
        font-size="104" font-weight="900" letter-spacing="-2"
        fill="#FFFFFF">T-Link</text>
</svg>
